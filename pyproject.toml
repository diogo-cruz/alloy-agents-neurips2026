[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alloy-agents-neurips2026"
version = "1.0.0"
description = "Alloy agents (LLMs alternating within one conversation trace): code and derived data for 'Alloy Agents Can Be More Dangerous Than Either Model Alone' (NeurIPS 2026)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Diogo Cruz" }]
requires-python = ">=3.11"
dependencies = [
    "inspect-ai==0.3.188",
    "control-arena",
    "openai==2.26.0",
    "google-genai==2.14.0",
    "docker>=7.1",
    "numpy==2.4.2",
    "scipy==1.17.1",
    "matplotlib==3.11.1",
]

[project.urls]
Repository = "https://github.com/diogo-cruz/alloy-agents-neurips2026"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
control-arena = { git = "https://github.com/UKGovernmentBEIS/control-arena.git", rev = "fd57383b7022ffb56b54784993922775c22ba196" }
